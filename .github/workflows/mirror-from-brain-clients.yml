name: Mirror images from brain-clients

# Copies finished post images from the private repo vestival/brain-clients into this public repo,
# so Buffer can read them from raw.githubusercontent.com. Never overwrites a file that already exists.
# Needs the repository secret BRAIN_CLIENTS_TOKEN: a fine-grained token with read access to
# vestival/brain-clients contents.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check token
        env:
          TOKEN: ${{ secrets.BRAIN_CLIENTS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the BRAIN_CLIENTS_TOKEN secret (read access to vestival/brain-clients)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: vestival/brain-clients
          token: ${{ secrets.BRAIN_CLIENTS_TOKEN }}
          path: brain
          fetch-depth: 1
          sparse-checkout: |
            personal/linkedin/assets
            omni/assets

      - name: Copy new images
        id: copy
        run: |
          set -euo pipefail
          n=0
          copy_new() { # <source dir> <dest dir> <regex on file name>
            src="brain/$1"; dst="$2"; re="$3"
            [ -d "$src" ] || return 0
            mkdir -p "$dst"
            for f in "$src"/*; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "$name" | grep -Eq "$re" || continue
              [ -e "$dst/$name" ] && continue
              cp "$f" "$dst/$name"
              echo "new: $dst/$name"
              n=$((n+1))
            done
          }
          copy_new personal/linkedin/assets assets '^VICTOR-.*\.(png|jpe?g|pdf)$'
          copy_new omni/assets omni '^OG-.*-final\.(png|jpe?g)$'
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.copy.outputs.count != '0'
        run: |
          git config user.name "Victor Estival"
          git config user.email "victor.estival@gmail.com"
          git add assets omni
          git commit -m "Sync ${{ steps.copy.outputs.count }} assets"
          git push
